# Daedalus deployment config. Copy to config.yaml and fill in.
# This file is the ONLY sanctioned place for environment-specific values
# besides the vault. If something you need has no home here, it goes back to
# the development site as a proposal — never as a local patch (PRD §5.4).

target:
  # The harness Daedalus builds and maintains.
  repo: https://github.com/OWNER/REPO.git
  branch: main

  # Optional. The checkout directory name under target/, when it must differ
  # from the repo URL's basename (e.g. a deployment whose checkout directory
  # differs from its repo name). Omit to default to the basename. Must be a
  # single directory name — no "/", no "..", not absolute.
  # dir: REPO

  # Repos cloned INTO the ship checkout, at the exact paths they occupy in the
  # operator's real tree. Layout fidelity is a correctness requirement: a
  # target whose shape differs from the original turns every relative path
  # into a false finding, and a "fix" for a link that is not broken becomes a
  # real change to a working harness.
  # Form: path=url, comma separated. Omit the key when the target is one repo.
  nested: agents/AGENT=https://github.com/OWNER/IDENTITY.git

  # A repo whose DIRECTORY NAMES are recreated empty inside the ship checkout.
  # Contents are never downloaded. Use this where a target harness expects a
  # directory tree to exist — scripts write into it — but its contents are the
  # operator's private material rather than part of the harness.
  # Form: path=url, comma separated. Omit the key when nothing needs scaffolding.
  scaffold: vaults/AGENT=https://github.com/OWNER/VAULT.git

vault:
  # The knowledge base for that harness. One per target; never shared.
  repo: https://github.com/OWNER/REPO-kb.git

gates:
  # Commands run against the target checkout. Each must exit 0 on success.
  # Run from the target repo root. Green is an exit code.
  - echo "replace me with the target's test suite"

proposals:
  # Maximum open PROPOSED documents. Daedalus must retire one to raise
  # another — this forces prioritization onto Daedalus, not the operator.
  budget: 5

verify:
  # Rung 2: a fresh-context refuter reviews every PASS. Off until rung 1 has
  # run on real assignments and the record shows a green gate passing
  # something a reader would have caught.
  refute: false
  # Seconds the refuter's claude invocation may run before its whole process
  # group is killed and the run FAILs as uncertifiable (exit 2 — never
  # STANDS). A hung reviewer used to hang gates.sh indefinitely. A whole
  # number of seconds, 1..9999999; absent or empty means 600. Anything else
  # is refused before any gate runs.
  refute_timeout: 600

recall:
  # Optional retrieval layer (spec: document-recall-and-code-context design).
  # Deployment-owned engine commands, same trust model as gates:.
  # SINGLE-QUOTE the command values: cfg strips edge quotes blindly, so a
  # bare value ending in a quote character silently loses it. Comments on
  # their own lines only — cfg does not strip inline comments.
  # Both commands run as: bash -c "<cmd>" _ <args...> with
  # DAEDALUS_RECALL_STORE exported (resolved absolute store path; the
  # command MUST read it). vault-query receives the query text as "$1" --
  # reference "$1" in the command yourself; the runner never appends it.
  # vault-index takes no args; its stdout MUST end with a line
  # "indexed=<int> purged=<int>".
  vault-query: '<command printing JSON results for query "$1">'
  vault-index: '<command that (re)indexes the vault into the store>'
  # Store location: a relative path resolved under the Daedalus home.
  # Absolute paths and ".." are rejected.
  store: state/chroma
  # Code context engine (optional). Pin the version: an unpinned uvx ruff
  # floats to latest and un-certifies the JSON shape the hook parses.
  ruff: 'uvx ruff@0.16.5'
