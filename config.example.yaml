# Daedalus deployment config. Copy to config.yaml and fill in.
# This file is the ONLY sanctioned place for environment-specific values
# besides the vault. If something you need has no home here, it goes back to
# the development site as a proposal — never as a local patch (PRD §5.4).

target:
  # The harness Daedalus builds and maintains. It is checked out under target/;
  # each window's worktrees/<NN>/ mirrors that layout (the same repo, nested
  # and scaffold paths) and is where that window builds.
  repo: https://github.com/OWNER/REPO.git
  branch: main

  # Optional. The checkout directory name under target/, when it must differ
  # from the repo URL's basename (e.g. a deployment whose checkout directory
  # differs from its repo name). Omit to default to the basename. Must be a
  # single directory name — no "/", no "..", not absolute.
  # dir: REPO

  # Repos cloned INTO the ship checkout, at the exact paths they occupy in the
  # operator's real tree. Layout fidelity is a correctness requirement: a
  # target whose shape differs from the original turns every relative path
  # into a false finding, and a "fix" for a link that is not broken becomes a
  # real change to a working harness.
  # Form: path=url, comma separated. Omit the key when the target is one repo.
  nested: agents/AGENT=https://github.com/OWNER/IDENTITY.git

  # Optional. Files inside the target checkout to leave OUT of the evidence
  # fingerprint: distribution metadata whose prose edits would otherwise
  # invalidate every evidence citation and force a full gate run (measured
  # on one deployment: six full suite runs in a day from changelog wording
  # and a version bump, with the tested code unchanged). Comma separated,
  # relative to the target root. Name ONLY files no gate command reads —
  # excluding one a test depends on hides a real change, and that check is
  # yours, not Daedalus's. A gitignored path is skipped; a path that could
  # leave the checkout ("/", "..") nulls the fingerprint with the reason in
  # fingerprint.err. Changing this list changes config-sha, which itself
  # retires existing citations — set it once, deliberately.
  # fingerprint_exclude: VERSION, CHANGELOG.md

  # A repo whose DIRECTORY NAMES are recreated empty inside the ship checkout.
  # Contents are never downloaded. Use this where a target harness expects a
  # directory tree to exist — scripts write into it — but its contents are the
  # operator's private material rather than part of the harness.
  # Form: path=url, comma separated. Omit the key when nothing needs scaffolding.
  scaffold: vaults/AGENT=https://github.com/OWNER/VAULT.git

vault:
  # The knowledge base for that harness. One per target; never shared.
  repo: https://github.com/OWNER/REPO-kb.git

gates:
  # Commands run against the target checkout. Each must exit 0 on success.
  # Run from the target repo root. Green is an exit code.
  - echo "replace me with the target's test suite"

# Optional. Commands run in the tree under test before the gates: a window's
# worktree, or the scratch copy promote cuts for the merged tree, which holds
# tracked files only. Build what the gates need here (a virtual environment,
# say). Same trust as gates:, run from the target root, each logged beside
# the gate logs and recorded in the evidence. A step that fails ends the run
# INVALID before any gate — never FAIL, since nothing was tested. What a
# step leaves behind must be ignored by git: the fingerprinted tree is the
# commit's tree, so a step that changes what git sees ends the run INVALID
# too. A gate that exits 127 ("command not found") in a promote scratch is
# the sign this is missing.
# gates_setup:
#   - cd engine && uv sync --frozen

proposals:
  # Maximum open PROPOSED documents. Daedalus must retire one to raise
  # another — this forces prioritization onto Daedalus, not the operator.
  budget: 5

verify:
  # Rung 2: a fresh-context refuter (core/agents/refuter.md — Read/Grep/Glob
  # only, no Bash, no CLAUDE.md, no memory; run by core/call-agent.sh
  # --callee refuter) reviews every PASS and ends with
  # VERDICT: REFUTED or STANDS. REFUTED flips the run to FAIL with the review
  # as the log; a crashed, timed-out or verdict-less review is uncertifiable
  # and FAILs too — never STANDS. ON by default: omitting this key means true.
  refute: true
  # The off-switch. `refute: false` is honored ONLY when refute_off_reason is
  # a non-empty string saying why; without one gates.sh refuses to run any
  # gate. An unreviewed green run is this project's founding pitfall, so
  # turning the reviewer off is a decision that has to be written down.
  # refute: false
  # refute_off_reason: rung 1 has not run on a real assignment here yet
  # Optional. Model for the refuter, overriding the charter's (opus). An
  # alias (sonnet, opus) or a full model name. Omit to use the charter's.
  # refute_model: sonnet
  # Seconds the refuter's claude invocation may run before its whole process
  # group is killed and the run FAILs as uncertifiable (exit 2 — never
  # STANDS). A hung reviewer used to hang gates.sh indefinitely. A whole
  # number of seconds, 1..9999999; absent or empty means 600 — so default-on
  # needs no timeout line. Anything else is refused before any gate runs.
  refute_timeout: 600

boundary:
  # May Daedalus edit its own brief? false (the default): no. true: it edits
  # CLAUDE.local.md, never CLAUDE.md, which is distribution code. Local brief
  # text lives in CLAUDE.local.md (gitignored; Claude Code loads it after
  # CLAUDE.md), so a release never conflicts with it.
  edit_brief: false

# `daedalus update` (optional): it takes the release from the remote whose
# address is the release's, github.com/lpelty/daedalus, whatever that remote is
# called. A home that deliberately follows a mirror names the mirror here.
# update:
#   address: https://git.example.com/mirror/daedalus.git

# Direct calls (optional) — core/call-agent.sh. Uncomment to use.
# The target's own agent — the one Daedalus may summon for context or a
# review — is named HERE and nowhere else: core has no default and takes no
# callee home on the command line, so the same core calls one agent on one
# deployment and another agent on the next. --callee agent is refused while
# callee_home and callee_name are unset. Comments on their own lines only:
# cfg does not strip an inline comment.
# direct_call:
#   # The agent's Claude Code project root (absolute). The call runs there,
#   # so its identity loads from its own CLAUDE.md and hooks.
#   callee_home: /abs/path/to/agent-home
#   # Its name in the frame prompt and the receipts.
#   callee_name: AgentName
#   # Who authorized the exchange ("<human> authorized this exchange").
#   callee_human: OperatorName
#   # Who may call THIS Daedalus (--callee self). Comma separated; absent or
#   # empty means nobody. A name is a claim on one user account; the
#   # receipt records the invoking process as evidence.
#   callers: AgentName
#   # A line the agent's SessionStart writes into its transcript; the
#   # launcher looks for it to report "orientation: yes". Unset, a call to
#   # the agent reports "unverified" (exit 3). --callee self knows
#   # Daedalus's own line and ignores this key.
#   orientation_marker: 'Session orientation'
#   # Optional. The agent's own direct-call launcher (absolute path). When
#   # set, --callee agent runs it instead of a bare claude -p, so the agent's
#   # allowlist, receipt and capture apply. It is called as
#   #   <launcher> <args> --caller Daedalus --request-file <file> --artifact-dir <dir>
#   #   <launcher> <args> --caller Daedalus --resume <its call id> --request-file <file>
#   # and must answer on stdout with "<Name> call <id>; receipt ..." and
#   # "... orientation: yes|no ..." on stderr. Exit 3 means it answered but
#   # could not verify orientation; exit 3 with no answer is a failure.
#   callee_launcher: /abs/path/to/callee-launcher
#   # Optional, with callee_launcher only: the <args> above, as shell words —
#   # whatever that launcher itself requires, typically its own name for the
#   # agent (a launcher serving several agents refuses a call without it).
#   # It may not name --caller, --request-file, --artifact-dir or --resume.
#   callee_launcher_args: --callee agentname
#   # Read-only tools, passed as --tools. Only Read, Grep and Glob are accepted.
#   tools: Read,Grep,Glob
#   max_turns: 40
#   # Seconds before the call's whole process group is killed (exit 124).
#   timeout: 600
#   # Re-capture the call's transcript into this deployment's memory: block
#   # afterwards, labelled with the caller and the callee.
#   capture: true
#   capture_wait: 90

recall:
  # Optional retrieval layer (spec: document-recall-and-code-context design).
  # Deployment-owned engine commands, same trust model as gates:.
  # SINGLE-QUOTE the command values: cfg strips edge quotes blindly, so a
  # bare value ending in a quote character silently loses it. Comments on
  # their own lines only — cfg does not strip inline comments.
  # Both commands run as: bash -c "<cmd>" _ <args...> with
  # DAEDALUS_RECALL_STORE exported (resolved absolute store path; the
  # command MUST read it). vault-query receives the query text as "$1" --
  # reference "$1" in the command yourself; the runner never appends it.
  # vault-index takes no args; its stdout MUST end with a line
  # "indexed=<int> purged=<int>".
  vault-query: '<command printing JSON results for query "$1">'
  vault-index: '<command that (re)indexes the vault into the store>'
  # Store location: a relative path resolved under the Daedalus home.
  # Absolute paths and ".." are rejected.
  store: state/chroma
  # Code context engine (optional). Pin the version: an unpinned uvx ruff
  # floats to latest and un-certifies the JSON shape the hook parses.
  ruff: 'uvx ruff@0.16.5'

leases:
  # How long a window may go without a prompt before the board calls it
  # "quiet" (a live terminal the operator left open). Never swept without
  # --force. An integer with an m, h or d suffix; default 4h.
  stale_after: 4h

promote:
  # How the operator's yes reaches core/promote.sh. transcribed = the prime
  # types the operator's words and promote checks them against the session's
  # own transcript (the default); tty = the operator types yes in a terminal
  # (the fallback when this build's transcript cannot be read).
  confirm: transcribed
  # Optional. On a deployment where a promote is a release (the next update
  # step ships it to every user), the decision block and the pushed line say
  # so. Default false.
  # release_note: true
  # Optional, with release_note: the words this deployment's users type to
  # receive a release, for example its own command-line tool's update command.
  # update_command: 'tool update'
  # Optional, tty mode: the program the operator's terminal runs under when it
  # is not login, sshd, tmux or screen (for example an editor's built-in
  # terminal); several are separated by commas. The typed yes is refused from
  # anything else (plan 4 Decision 32).
  # tty_parents: 'Code Helper'

# memory:
#   # Optional — episodic capture into a Hindsight bank. THE source for
#   # capture's configuration (core/close.sh, the Stop and SessionEnd hooks);
#   # an environment variable of the same meaning (TENANT_BANK,
#   # HINDSIGHT_API_URL, ...) overrides one field. Shipped commented out:
#   # a block turns on a capture at every Stop, so add it once a server runs.
#   bank: daedalus
#   api_url: http://127.0.0.1:8888
#   # The REST API key, in a file under this home, mode 0600. Never the key
#   # itself here, and never on a hook command line (visible to ps).
#   api_key_file: state/hindsight/api-key
#   # Seconds between captures of one transcript at Stop.
#   capture_interval: 120
#   # Optional. Default: $CLAUDE_CONFIG_DIR/projects/<this home's resolved
#   # path, every character but letters and digits as ->.
#   # transcript_dir: /path/to/transcripts
#   # Optional turn labels; default User / Assistant.
#   # user_label: OPERATOR
#   # assistant_label: Daedalus

# ami:
#   # Optional — the AMI (Artificial Machine Intelligence): Strands Decider 2B
#   # through `strands-decider serve`, switched by /frame-jack. Absent, the
#   # switch refuses with the lines to paste. Comments on their own lines only.
#   # The strands-decider executable, absolute: the one in the virtual
#   # environment it was installed into (README "Frame-jack"). Never on PATH.
#   command: /abs/path/to/ami-venv/bin/strands-decider
#   model: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610
#   # mlx (recommended on Apple silicon), mps, or cpu.
#   device: mlx
#   # The daemon's port, 1024..65535. Every window of this deployment shares
#   # the one daemon. A second deployment on the machine should name the SAME
#   # port and borrow it (doctor says when it does not): two ports = two
#   # daemons = twice 5.3 GB resident.
#   port: 8761
#   # true where Hugging Face is unreachable (weights copied by hand, README
#   # "Weights by hand"): the daemon runs with HF_HUB_OFFLINE=1 and never
#   # tries the network.
#   offline: false
#   # Optional. Where the weights cache is, when not ~/.cache/huggingface.
#   # weights_cache: /abs/path
#   # Stop the daemon on battery and start it again on AC power. Default true.
#   battery_off: true
#   # Per-question request timeout, milliseconds; past it the question is
#   # unanswered. Default 1500 (measured single-caller p99 441 ms).
#   request_timeout_ms: 1500
#   # The questions asked in shadow mode, comma separated. Default both.
#   shadow: destructive, suite
#   # Questions allowed to act. NONE is certified in this release; naming one
#   # here is a doctor MISSING and the question stays in shadow mode.
#   # enforce:
